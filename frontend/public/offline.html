<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Hors connexion — Unmask</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 24px;
      background: #0b0b0b; color: #eeeeee;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 420px; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .badge {
      width: 72px; height: 72px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(12, 221, 165, 0.12);
      border: 1px solid rgba(12, 221, 165, 0.28);
    }
    h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    p { font-size: 14px; line-height: 1.6; color: #8a8a8a; margin: 0; }
    button {
      margin-top: 6px; padding: 12px 22px; border: 0; border-radius: 14px;
      background: #0cdda5; color: #06140f; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .15s ease;
    }
    button:hover { opacity: .9; }
    button:active { transform: scale(.97); }
    .hint { font-size: 12px; color: #5a5a5a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="#0cdda5" stroke-width="1.8" />
        <path d="M16.5 16.5L21 21" stroke="#0cdda5" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </div>
    <h1>Vous êtes hors connexion</h1>
    <p>Impossible de joindre Unmask pour le moment. Vérifiez votre connexion internet : l'analyse de crédibilité nécessite l'accès aux sources publiques en ligne.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <p class="hint">Unmask — analyse de crédibilité</p>
  </main>
</body>
</html>
